<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>С днём рождения!</title>
    <link rel="stylesheet" href="css.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="card-container">
      <div class="sticks left-sticks">
        <div class="stick stick-1"></div>
        <div class="stick stick-2"></div>
      </div>

      <div class="text-container">
        <p class="top-text">Поздравляю</p>
        <p class="down-text">С днём рождения!</p>
        <div class="heart">♡</div>
      </div>

      <div class="sticks right-sticks">
        <div class="stick stick-1"></div>
        <div class="stick stick-2"></div>
      </div>
    </div>
    <button class="scroll-forward">Продолжить просмотр</button>
  </body>
